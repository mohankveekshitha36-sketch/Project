{% extends "base.html" %}

{% block title %}System Settings | MediComply AI{% endblock %}
{% block page_title %}Compliance Engine Configuration{% endblock %}

{% block content %}
<div class="row g-4" data-aos="fade-up">
    <div class="col-md-4">
        <div class="glass-card p-4">
            <h6 class="fw-bold mb-4">AI Sensitivity Levels</h6>
            <div class="mb-4">
                <label class="form-label small">Confidence Threshold</label>
                <input type="range" class="form-range" min="0" max="100" value="85">
                <div class="d-flex justify-content-between x-small text-muted">
                    <span>Aggressive</span>
                    <span>Conservative (85%)</span>
                </div>
            </div>
            <div class="form-check form-switch mb-3">
                <input class="form-check-switch" type="checkbox" checked>
                <label class="form-check-label small">Auto-resolve Low Risk</label>
            </div>
        </div>
    </div>
    <div class="col-md-8">
        <div class="glass-card p-4">
            <h6 class="fw-bold mb-4">Notification Protocols</h6>
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label small">Primary Alert Email</label>
                    <input type="email" class="form-control form-control-sm glass-card"
                        value="compliance@hospital-demo.com">
                </div>
                <div class="col-md-6">
                    <label class="form-label small">Emergency SMS</label>
                    <input type="text" class="form-control form-control-sm glass-card" value="+1 (555) 900-3412">
                </div>
            </div>
            <hr class="my-4 opacity-10">
            <div class="d-flex justify-content-end">
                <button class="btn btn-primary rounded-pill px-4">Save Configuration</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}
